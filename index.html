<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUmigos da UESB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f1;--card:#fff;--ink:#17231d;--mut:#5d6a63;--line:#dde2d8;--acc:#2b4eff;--accsoft:#e3e8ff;--sage:#dfe7d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121914;--card:#1b251f;--ink:#eef2ea;--mut:#9aa89f;--line:#2b382f;--acc:#8ea3ff;--accsoft:#232b4f;--sage:#1f2b23}}
:root[data-theme="dark"]{--bg:#121914;--card:#1b251f;--ink:#eef2ea;--mut:#9aa89f;--line:#2b382f;--acc:#8ea3ff;--accsoft:#232b4f;--sage:#1f2b23}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.08;margin:0;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font:700 19px "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.02em}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:26px;font-size:15px;font-weight:500}
nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:600 15px Figtree,sans-serif;text-decoration:none;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10163a}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding:56px 0 72px}
.hero h1{font-size:clamp(40px,6vw,72px)}
.hero p{color:var(--mut);font-size:18px;max-width:46ch;margin:22px 0 30px}
.hero .ph{aspect-ratio:4/4.6;border-radius:28px;overflow:hidden;position:relative}
.tag{position:absolute;left:16px;bottom:16px;background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.stats{display:flex;gap:32px;margin-top:34px;color:var(--mut);font-size:14px}
.stats b{display:block;font:700 28px "Bricolage Grotesque",sans-serif;color:var(--ink)}
.ph svg{width:100%;height:100%;display:block}
.tools{padding:8px 0 28px}
.tools h2{font-size:clamp(28px,3.4vw,40px);margin-bottom:22px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 16px;max-width:520px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:500 16px Figtree,sans-serif;padding:15px 0;outline:0}
.search:focus-within{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 18px;font:500 15px Figtree,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;padding:12px 0 80px}
.card{background:var(--card);border-radius:20px;overflow:hidden;text-decoration:none;display:block;border:1px solid var(--line);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:4/4.4}
.card .bd{padding:16px 18px 20px}
.card h3{font-size:22px}
.card .meta{color:var(--mut);font-size:14px;margin-top:4px}
.badge{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--sage)}
.badge.adocao{background:var(--accsoft);color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.about{background:var(--sage);padding:72px 0}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.about h2{font-size:clamp(30px,4vw,46px)}
.about p{color:var(--mut);max-width:52ch}
.help{display:grid;gap:14px}
.help div{background:var(--card);border-radius:18px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
.help svg{width:26px;height:26px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.help b{display:block}.help span{color:var(--mut);font-size:15px}
footer{padding:32px 0;color:var(--mut);font-size:14px}
.back{display:inline-flex;gap:8px;margin:28px 0 20px;text-decoration:none;font-weight:600;color:var(--mut)}
.fic{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding-bottom:80px}
.gal .main{aspect-ratio:1/1.05;border-radius:28px;overflow:hidden}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:none}
.thumbs button[aria-current=true]{border-color:var(--acc)}
.fic h1{font-size:clamp(40px,6vw,68px);margin:6px 0 14px}
.fic .sub{color:var(--mut);margin-bottom:22px}
.fic h3{font-size:19px;margin:26px 0 8px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.kv small{display:block;color:var(--mut);font-size:13px}
.traits{display:flex;flex-wrap:wrap;gap:8px}.traits span{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px}
.note{font-size:13px;color:var(--mut);margin-top:40px}
.sp{position:absolute;top:12px;left:12px;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.sp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph,.main{position:relative}
.loc{display:flex;gap:5px;align-items:center}.pin{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
select,dialog input,dialog select,dialog textarea{font:500 15px Figtree,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.row select{width:auto}
dialog{border:0;border-radius:24px;padding:28px;max-width:560px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(10,18,13,.55)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog label{font-size:13px;color:var(--mut);display:grid;gap:4px}
dialog .full{grid-column:1/-1}
@media(max-width:820px){nav{display:none}.hero,.about .wrap,.fic{grid-template-columns:1fr;gap:32px}.hero{padding-top:28px}.wrap{padding:0 18px}}
</style>
</head>
<body>
<header><div class="wrap">
 <a class="logo" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--acc)"/><path d="M8 11c0-3 4-3 4 1v3M24 11c0-3-4-3-4 1v3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="16" cy="18" r="6" fill="#fff"/><circle cx="14" cy="17" r="1" fill="#17231d"/><circle cx="18" cy="17" r="1" fill="#17231d"/><ellipse cx="16" cy="20" rx="1.6" ry="1.1" fill="#17231d"/></svg>AUmigos da UESB</a>
 <nav><a href="#/">Início</a><a href="#catalogo">Catálogo</a><a href="#sobre">O projeto</a><a href="#ajudar">Como ajudar</a></nav>
 <span style="display:flex;gap:8px"><button class="btn ghost" id="adm"></button><a class="btn" href="#ajudar">Quero ajudar</a></span>
</div></header>

<main id="app"></main>

<dialog id="dlg"><h2 style="font-size:28px;margin-bottom:16px">Adicionar animal</h2><form id="frm" method="dialog">
<label class="full">Nome<input name="nome" required></label>
<label>Espécie<select name="esp"><option>Cachorro</option><option>Gato</option></select></label>
<label>Sexo<select name="sexo"><option>Macho</option><option>Fêmea</option></select></label>
<label>Idade aproximada<input name="idade" placeholder="ex.: cerca de 2 anos" required></label>
<label>Status<select name="status"><option>Comunitário</option><option>Em adoção</option><option>Adotado</option></select></label>
<label>Localização<select name="mod">${""}</select></label>
<label>Onde costuma ficar<input name="local" placeholder="ex.: perto da cantina"></label>
<label class="full">História<textarea name="hist" rows="3"></textarea></label>
<label>Personalidade (separe por vírgula)<input name="pers"></label>
<label>Características<input name="car"></label>
<label class="full">Fotos (até 3)<input name="fotos" type="file" accept="image/*" multiple></label>
<div class="full" style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="save">Salvar animal</button></div></form></dialog>
<script>
const DOGS=[
{id:"caramelo",esp:"Cachorro",mod:"Módulo I",nome:"Caramelo",sexo:"Macho",idade:"cerca de 4 anos",status:"Comunitário",local:"Em frente ao pavilhão de aulas",coat:"#c98a4b",ear:"#a26a33",bg:"#e9d9b8",hist:"Chegou ao campus como filhote, seguindo um grupo de estudantes. Hoje é o recepcionista não oficial do pavilhão: acompanha quem chega e se despede de quem sai.",pers:["Sociável","Calmo","Adora petiscos"],car:"Pelagem caramelo, porte médio, orelha esquerda levemente caída."},
{id:"jujuba",esp:"Cachorro",mod:"Biblioteca",nome:"Jujuba",sexo:"Fêmea",idade:"cerca de 1 ano",status:"Em adoção",local:"Biblioteca central",coat:"#2c2a29",ear:"#1a1918",bg:"#cfe0d6",hist:"Resgatada perto da biblioteca, já castrada e vacinada. Procura uma família com quintal ou muita disposição para caminhadas.",pers:["Brincalhona","Esperta","Energética"],car:"Pelo preto curto, peito branco, porte pequeno a médio."},
{id:"pipoca",esp:"Cachorro",mod:"Restaurante Universitário",nome:"Pipoca",sexo:"Fêmea",idade:"cerca de 6 anos",status:"Comunitária",local:"Restaurante universitário",coat:"#ece3cf",ear:"#cdbf9f",bg:"#d9e2f2",hist:"Uma das moradoras mais antigas do campus. Conhece o horário do almoço melhor que muitos professores.",pers:["Tranquila","Carinhosa","Independente"],car:"Pelagem creme clara, focinho rosado, porte médio."},
{id:"thor",esp:"Cachorro",mod:"Estacionamento",nome:"Thor",sexo:"Macho",idade:"cerca de 3 anos",status:"Adotado",local:"Antigo ponto: estacionamento",coat:"#6d5844",ear:"#3f3226",bg:"#e7d6d6",hist:"Foi adotado por uma técnica do campus e agora passeia de coleira. Continua visitando os amigos de vez em quando.",pers:["Protetor","Leal","Curioso"],car:"Pelagem marrom escura, porte grande."},
{id:"mel",esp:"Cachorro",mod:"Módulo III",nome:"Mel",sexo:"Fêmea",idade:"cerca de 2 anos",status:"Em adoção",local:"Bloco de Ciências Biológicas",coat:"#d9a441",ear:"#b07f25",bg:"#dbe8d3",hist:"Acompanhou os estudantes de biologia durante um semestre inteiro. Dócil com crianças e com outros cães.",pers:["Dócil","Afetuosa","Sociável"],car:"Pelagem dourada, porte médio, olhos claros."},
{id:"bolinha",esp:"Cachorro",mod:"Quadra",nome:"Bolinha",sexo:"Macho",idade:"cerca de 8 anos",status:"Comunitário",local:"Quadra poliesportiva",coat:"#9b9b98",ear:"#6f6f6c",bg:"#e3e0ef",hist:"Veterano do campus. Gosta de sombra, de carinho na cabeça e de assistir aos treinos de longe.",pers:["Sossegado","Idoso","Paciente"],car:"Pelagem cinza, porte pequeno, focinho já grisalho."},
{id:"nina",esp:"Cachorro",mod:"Módulo IV",nome:"Nina",sexo:"Fêmea",idade:"cerca de 5 meses",status:"Em adoção",local:"Abrigo temporário do projeto",coat:"#7a4a2d",ear:"#4e2d1a",bg:"#f0dcc8",hist:"Filhote encontrada em um dia de chuva. Está vacinada, vermifugada e pronta para aprender tudo.",pers:["Filhote","Agitada","Aprendiz"],car:"Pelagem castanha, patas grandes, vai crescer bastante."},
{id:"zeca",esp:"Cachorro",mod:"Portaria",nome:"Zeca",sexo:"Macho",idade:"cerca de 2 anos",status:"Adotado",local:"Antigo ponto: portaria",coat:"#f2f0ea",ear:"#2c2a29",bg:"#cfdde0",hist:"Adotado por um estudante de veterinária. Deixou saudade na portaria e uma foto na parede da secretaria.",pers:["Esperto","Brincalhão","Apegado"],car:"Branco com manchas pretas nas orelhas."},
{id:"mingau",esp:"Gato",mod:"Módulo II",nome:"Mingau",sexo:"Macho",idade:"cerca de 3 anos",status:"Comunitário",local:"Jardim entre os módulos",coat:"#e8b77a",ear:"#c08a4d",bg:"#dde6dc",hist:"Dorme nos bancos do jardim e aparece quando alguém abre um pacote de biscoito. Já é figura conhecida dos corredores.",pers:["Independente","Dorminhoco","Carinhoso"],car:"Laranja, rabo comprido, olhos verdes."}
];
const MODS=["Módulo I","Módulo II","Módulo III","Módulo IV","Biblioteca","Restaurante Universitário","Quadra","Estacionamento","Portaria","Outro local"];
let admin=false;try{admin=localStorage.auu_admin==="1";JSON.parse(localStorage.auu_extras||"[]").forEach(x=>DOGS.push(x))}catch(e){}
const ico=e=>e==="Gato"?`<span class="sp" title="Gato"><svg viewBox="0 0 24 24"><path d="M5 9V4l4 3h6l4-3v5c1 2 1 4 0 6-2 4-12 4-14 0-1-2-1-4 0-6z"/><path d="M9.5 13h.01M14.5 13h.01M10 16.5c1 .7 3 .7 4 0"/></svg>Gato</span>`:`<span class="sp" title="Cachorro"><svg viewBox="0 0 24 24"><path d="M7 6C4 5 3 9 4 13l3-1M17 6c3-1 4 3 3 7l-3-1"/><path d="M7 6h10l1 7c0 4-3 7-6 7s-6-3-6-7z"/><path d="M9.5 12h.01M14.5 12h.01M10.5 16c.8.6 2.2.6 3 0"/></svg>Cachorro</span>`;
const pin=`<svg class="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// Ilustração provisória. Para usar fotos reais, preencha "foto" com uma imagem embutida (data:image/jpeg;base64,...)
function art(d,v=0){
 if(d.foto&&d.foto.length&&d.foto[v%d.foto.length])return `<img src="${d.foto[v%d.foto.length]}" alt="Foto de ${d.nome}" style="width:100%;height:100%;object-fit:cover">`;
 const bgs=[d.bg,"#e9ecdf","#d9dff0"],dx=[0,-18,16][v],tilt=[0,-6,7][v];
 return `<svg viewBox="0 0 400 440" role="img" aria-label="Ilustração provisória de ${esc(d.nome)}"><rect width="400" height="440" fill="${bgs[v]}"/><ellipse cx="200" cy="470" rx="200" ry="120" fill="${d.coat}" opacity=".9"/><g transform="translate(${dx} 0) rotate(${tilt} 200 260)">${d.esp==="Gato"?`<path d="M114 60l-16 120 88-46zM286 60l16 120-88-46z" fill="${d.ear}"/><ellipse cx="200" cy="220" rx="102" ry="92" fill="${d.coat}"/><path d="M60 250l80 6M60 280l80-12M340 250l-80 6M340 280l-80-12" stroke="#17231d" stroke-width="3" opacity=".5"/>`:`<path d="M112 130c-46 0-56 88-34 130 20 10 50-20 56-70zM288 130c46 0 56 88 34 130-20 10-50-20-56-70z" fill="${d.ear}"/><ellipse cx="200" cy="215" rx="98" ry="104" fill="${d.coat}"/>`}<ellipse cx="200" cy="262" rx="52" ry="42" fill="#fff" opacity=".28"/><circle cx="160" cy="200" r="12" fill="#17231d"/><circle cx="240" cy="200" r="12" fill="#17231d"/><circle cx="164" cy="196" r="3.5" fill="#fff"/><circle cx="244" cy="196" r="3.5" fill="#fff"/><ellipse cx="200" cy="250" rx="19" ry="14" fill="#17231d"/><path d="M200 264v14M182 282c10 8 26 8 36 0" stroke="#17231d" stroke-width="4" fill="none" stroke-linecap="round"/></g></svg>`;
}
const cls=s=>s==="Em adoção"?"badge adocao":"badge";
let filtro="Todos",busca="";
const FILTROS=["Todos","Machos","Fêmeas","Comunitários","Em adoção","Adotados","Cachorros","Gatos"];
let loc="Todos os locais";
function passa(d){
 const f={"Todos":1,"Machos":d.sexo==="Macho","Fêmeas":d.sexo==="Fêmea","Comunitários":d.status.startsWith("Comunit"),"Em adoção":d.status==="Em adoção","Adotados":d.status==="Adotado","Cachorros":d.esp==="Cachorro","Gatos":d.esp==="Gato"}[filtro];
 if(loc!=="Todos os locais"&&d.mod!==loc)return false;
 return f&&d.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(busca.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim());
}
function lista(){
 const r=DOGS.filter(passa);
 document.getElementById("grid").innerHTML=r.length?r.map(d=>`<a class="card" href="#/cao/${d.id}"><div class="ph">${art(d)}${ico(d.esp)}</div><div class="bd"><h3>${esc(d.nome)}</h3><div class="meta">${d.sexo} · ${d.idade}</div><div class="meta loc">${pin}${esc(d.mod)}</div><span class="${cls(d.status)}">${d.status}</span></div></a>`).join(""):`<p class="empty">Nenhum AUmigo encontrado. Tente outro nome ou filtro.</p>`;
 document.getElementById("cnt").textContent=r.length+(r.length===1?" animal":" animais");
}
function home(){
 const n=k=>DOGS.filter(d=>d.status===k).length,d0=DOGS[0];
 document.getElementById("app").innerHTML=`
 <section class="wrap hero"><div>
  <h1>Conheça os AUmigos da UESB</h1>
  <p>Um catálogo com as fotos, histórias e cuidados dos cães e gatos que vivem ou circulam pelo campus. Aqui você descobre quem é quem, onde cada um costuma ficar e como ajudar.</p>
  <a class="btn" href="#catalogo">Ver catálogo</a> <a class="btn ghost" href="#sobre">Sobre o projeto</a>
  <div class="stats"><div><b>${DOGS.length}</b>animais catalogados</div><div><b>${n("Em adoção")}</b>esperando um lar</div><div><b>${n("Adotado")}</b>já adotados</div></div>
 </div><div class="ph">${art(d0)}<span class="tag"><i class="dot"></i>${d0.nome}, o recepcionista do campus</span></div></section>
 <section class="wrap tools" id="catalogo"><h2>Encontre um AUmigo</h2>
  <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Buscar pelo nome do animal" aria-label="Buscar animal pelo nome" value="${esc(busca)}"></label>
  <div class="chips" role="group" aria-label="Filtros">${FILTROS.map(f=>`<button class="chip" aria-pressed="${f===filtro}" data-f="${f}">${f}</button>`).join("")}</div>
  <div class="row"><select id="loc" aria-label="Filtrar por localização">${["Todos os locais",...MODS].map(m=>`<option${m===loc?" selected":""}>${m}</option>`).join("")}</select>${admin?`<button class="btn" id="add">+ Adicionar animal</button>`:""}</div><p class="meta" id="cnt" style="color:var(--mut);margin:18px 0 0"></p></section>
 <section class="wrap grid" id="grid"></section>
 <section class="about" id="sobre"><div class="wrap"><div><h2>Um registro feito com carinho</h2><p style="margin-top:18px">O AUmigos da UESB nasceu para documentar os animais do campus: quem são, onde ficam, como estão de saúde e quais precisam de um lar. Cada ficha é atualizada por estudantes e voluntários.</p><p>Este catálogo também ajuda a evitar abandonos e a acompanhar castrações, vacinas e adoções.</p></div>
 <div class="help" id="ajudar">
  <div><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 10c0 6-8 11-8 11z"/></svg><p style="margin:0"><b>Adote ou apadrinhe</b><span>Conheça os animais em adoção e fale com a equipe.</span></p></div>
  <div><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4zM9 8V5h6v3"/></svg><p style="margin:0"><b>Doe ração e materiais</b><span>Pontos de coleta no hall dos blocos e na biblioteca.</span></p></div>

function ficha(id){
 const d=DOGS.find(x=>x.id===id);if(!d)return home();
 document.getElementById("app").innerHTML=`<div class="wrap"><a class="back" href="#catalogo">← Voltar ao catálogo</a>
 <article class="fic"><div class="gal"><div class="main" id="main">${art(d,0)}${ico(d.esp)}</div><div class="thumbs">${[0,1,2].map(i=>`<button data-i="${i}" aria-label="Foto ${i+1}" aria-current="${i===0}">${art(d,i)}</button>`).join("")}</div></div>
 <div><span class="${cls(d.status)}">${d.status}</span><h1>${esc(d.nome)}</h1><p class="sub">${d.sexo} · ${d.idade}</p>
 <div class="kv"><div><small>Localização</small>${esc(d.mod)}</div><div><small>Onde costuma ficar</small>${esc(d.local)}</div><div><small>Espécie</small>${d.esp}</div><div><small>Status</small>${d.status}</div></div>
 <h3>História</h3><p style="margin:0;color:var(--mut)">${esc(d.hist)}</p>
 <h3>Personalidade</h3><div class="traits">${d.pers.map(p=>`<span>${esc(p)}</span>`).join("")}</div>
 <h3>Características</h3><p style="margin:0;color:var(--mut)">${esc(d.car)}</p>
 <p style="margin-top:26px"><a class="btn" href="#ajudar" onclick="setTimeout(()=>location.hash='#/',0)">${d.status==="Em adoção"?"Quero adotar "+esc(d.nome):"Como ajudar"}</a></p>
 </div></article></div>`;
 document.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{document.getElementById("main").innerHTML=art(d,+b.dataset.i)+ico(d.esp);document.querySelectorAll(".thumbs button").forEach(x=>x.setAttribute("aria-current",x===b))});
 scrollTo(0,0);
}
function rota(){const m=location.hash.match(/^#\/cao\/(.+)/);if(m)ficha(m[1]);else if(!document.getElementById("grid"))home();else if(location.hash==="#/"||!location.hash)scrollTo(0,0);}
addEventListener("hashchange",()=>{const m=location.hash.match(/^#\/cao\//);if(m||location.hash==="#/"){rota2()}});
function rota2(){const m=location.hash.match(/^#\/cao\/(.+)/);m?ficha(m[1]):home()}

const ADMIN_PIN="uesb2026"; // troque antes de publicar
function rAdm(){const b=document.getElementById("adm");b.textContent=admin?"Sair do modo admin":"Entrar como admin";}
document.getElementById("adm").onclick=()=>{
 if(admin){admin=false;try{localStorage.auu_admin="0"}catch(e){}}
 else{const v=prompt("Senha de administrador:");if(v===null)return;if(v!==ADMIN_PIN){alert("Senha incorreta.");return}admin=true;try{localStorage.auu_admin="1"}catch(e){}}
 rAdm();rota2();};
rAdm();
const dlg=document.getElementById("dlg"),frm=document.getElementById("frm");
frm.mod.innerHTML=MODS.map(m=>`<option>${m}</option>`).join("");
document.getElementById("cancel").onclick=()=>dlg.close();
function abrirForm(){if(!admin)return;frm.reset();dlg.showModal()}
function redim(f){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.78))};i.src=u})}
frm.onsubmit=async e=>{e.preventDefault();if(!admin)return;
 const f=new FormData(frm),fotos=await Promise.all([...frm.fotos.files].slice(0,3).map(redim));
 const esp=f.get("esp"),nome=f.get("nome").trim();
 const n={id:"a"+Date.now(),esp,mod:f.get("mod"),nome,sexo:f.get("sexo"),idade:f.get("idade"),status:f.get("status"),local:f.get("local")||f.get("mod"),coat:esp==="Gato"?"#b9a58c":"#b98a55",ear:"#7d5a36",bg:"#e3e7d8",hist:f.get("hist")||"História em breve.",pers:(f.get("pers")||"").split(",").map(x=>x.trim()).filter(Boolean),car:f.get("car")||"",foto:fotos};
 DOGS.push(n);
 try{const x=JSON.parse(localStorage.auu_extras||"[]");x.push(n);localStorage.auu_extras=JSON.stringify(x)}catch(err){alert("Animal adicionado, mas o navegador não conseguiu salvá-lo (fotos muito grandes?).")}
 dlg.close();home();};
